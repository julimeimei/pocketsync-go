services:
  postgres:
    image: postgres:17-alpine
    container_name: pocketsync-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pocketsync}
      POSTGRES_USER: ${POSTGRES_USER:-pocketsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pocketsync}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
